<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <button id="manualBtn">📘 Manual</button>
        <button id="personBtn">👤 Info</button>
    </header>

    <main>
        <div id="chatWindow"></div>

        <div id="chatInputArea">
            <input id="chatInput" type="text" placeholder="Ask me anything">
            <button id="sendBtn">Send</button>
        </div>
    </main>

    <footer>
        <button id="newReminderBtn">➕ Reminder</button>
        <button id="listReminderBtn">📅 All Reminders</button>
    </footer>

    <script type="module" src="app.js"></script>
</body>
</html>
